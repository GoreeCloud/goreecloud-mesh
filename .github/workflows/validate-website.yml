name: Validate Mesh Center GLAZE UI V1.1 Stable

on:
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/build_public_site.py'
      - 'scripts/validate_public_site.py'
      - 'scripts/verify_public_deployment.py'
      - '.github/workflows/validate-website.yml'
      - 'WEBSITE.md'
      - 'BRANDING.md'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build_public_site.py'
      - 'scripts/validate_public_site.py'
      - 'scripts/verify_public_deployment.py'
      - '.github/workflows/validate-website.yml'
      - 'WEBSITE.md'
      - 'BRANDING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact website candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact website candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out pinned GLAZE UI V1.1 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 15cc76d2bcd4065552dc31c77145b63f34d9e7b2
          path: .glaze-ui
          persist-credentials: false
      - name: Compile website tools
        run: python -m py_compile scripts/build_public_site.py scripts/validate_public_site.py scripts/verify_public_deployment.py
      - name: Validate deployment verifier configuration
        run: python scripts/verify_public_deployment.py --check-config
      - name: Validate source contract
        run: python scripts/validate_public_site.py
      - name: Build exact public candidate
        env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python scripts/build_public_site.py
      - name: Validate built artifact
        run: python scripts/validate_public_site.py --dist
      - name: Validate JavaScript syntax
        run: node --check website/site.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact deployed main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify mesh.goreecloud.com against reviewed main source
        run: python scripts/verify_public_deployment.py
