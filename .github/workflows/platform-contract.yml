name: Platform Contract

on:
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
      - README.md
      - docs/platform-conformance.json
      - docs/events.md
      - docs/durable-events.md
      - docs/replay-ownership.md
      - contracts/mesh.event.v1.json
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
      - README.md
      - docs/platform-conformance.json
      - docs/events.md
      - docs/durable-events.md
      - docs/replay-ownership.md
      - contracts/mesh.event.v1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@981c5807f249955e9f2c6c5d9136c9ed9c8017e9
    with:
      manifest-path: goreecloud.platform.yaml
