      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="routeB" x1="42" y1="204" x2="214" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
