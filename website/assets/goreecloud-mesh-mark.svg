<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">GoreeCloud Mesh Weave mark</title>
  <desc id="desc">Interwoven governed coordination routes connecting distributed endpoints without a single central authority hub.</desc>
  <defs>
