  <path d="M181 58v140" fill="none" stroke="url(#routeA)" stroke-width="10" stroke-linecap="round" opacity="0.72"/>

  <path d="M109 111c12-20 24-32 39-32" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
  <path d="M109 145c12 20 24 32 39 32" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" opacity="0.92"/>

  <g fill="#F8FAFC" stroke="url(#nodeStroke)" stroke-width="7">
    <circle cx="49" cy="79" r="14"/>
    <circle cx="49" cy="177" r="14"/>
    <circle cx="207" cy="116" r="14"/>
    <circle cx="207" cy="140" r="14"/>
